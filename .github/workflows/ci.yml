name: CI

on:
  push:
  pull_request:

jobs:
  spec:
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.6.6"
        gemfile:
          - Gemfile
          - Gemfiles/puppet-5.x

    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      BUNDLE_WITHOUT: acceptance
      CHECK: spec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: 2.4.22
          bundler-cache: true

      - name: Run specs
        env:
          SPEC_OPTS: "--format progress"
        run: bundle exec rake "$CHECK"
